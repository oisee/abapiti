name: oci-publish

# Publishes the nine A4H abapGit archives of a release (readable core, registry, tests
# base and six tests parts) to ghcr.io/<repo>/abaplint-a4h as OCI artifacts,
# one per archive (tag <layer>-<release>), plus a system index (tag <release>)
# listing them in import order. The blobs are the release
# assets byte for byte, so each layer's digest equals its SHA256SUMS entry.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to publish (e.g. v0.5.1)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      REPO: ghcr.io/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0
      - name: Log in to ghcr.io
        run: echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Download the A4H archives and checksums
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "$TAG" --repo "${{ github.repository }}" --dir assets \
            --pattern 'abaplint-*-a4h.zip' --pattern 'abaplint-*-a4h-registry.zip' --pattern 'abaplint-*-a4h-tests-*.zip' --pattern SHA256SUMS
          (cd assets && grep -E '  abaplint-[0-9a-f]+-a4h(-registry|-tests-(base|statements|rules_1|rules_2|syntax|objects|rest))?\.zip$' SHA256SUMS | sha256sum -c -)
      - name: Push one layer per archive, then the system index
        run: |
          set -euo pipefail
          commit=$(git ls-remote "https://github.com/${{ github.repository }}" "refs/tags/$TAG^{}" "refs/tags/$TAG" | head -1 | cut -f1)
          core=$(ls assets/abaplint-*-a4h.zip)
          registry=$(ls assets/abaplint-*-a4h-registry.zip)
          order=("$core" "$registry")
          for part in base statements rules_1 rules_2 syntax objects rest; do
            order+=("$(ls assets/abaplint-*-a4h-tests-$part.zip)")
          done
          [ "${#order[@]}" = 9 ]
          printf '| order | layer | digest | blob sha256 |\n|---:|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          manifests=()
          n=0
          for zip in "${order[@]}"; do
            n=$((n + 1))
            base=$(basename "$zip" .zip)
            name=$(printf '%s' "$base" | sed 's/^abaplint-[0-9a-f]*-a4h/zlnt-core/; s/^zlnt-core-registry$/zlnt-registry-a4h/; s/^zlnt-core-tests-/tests-/; s/^zlnt-core$/core/')
            kind=pack
            [ "$n" = 1 ] && kind=lib
            [ "$name" = zlnt-registry-a4h ] && kind=input
            dir=$(mktemp -d)
            cp "$zip" "$dir/abap.zip"
            printf '{"name":"%s","kind":"%s","source":{"repo":"https://github.com/%s","commit":"%s","path":"%s"}}' \
              "$name" "$kind" "${{ github.repository }}" "$commit" "$(basename "$zip")" > "$dir/config.json"
            (cd "$dir" && oras push "$REPO/abaplint-a4h:$name-$TAG" \
              --artifact-type application/vnd.osd.layer.v1 \
              --config config.json:application/vnd.osd.layer.config.v1+json \
              --annotation "org.osd.layer.order=$n" \
              --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --annotation "org.opencontainers.image.revision=$commit" \
              --annotation "org.opencontainers.image.version=$TAG" \
              abap.zip:application/vnd.osd.abapgit.zip)
            digest=$(oras resolve "$REPO/abaplint-a4h:$name-$TAG")
            manifests+=("$digest")
            printf '| %s | `%s:%s` | `%s` | `%s` |\n' "$n" "abaplint-a4h" "$name-$TAG" "$digest" "$(sha256sum "$zip" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          done
          # The index is a convenience; the layers above are the contract.
          if ! oras manifest index create "$REPO/abaplint-a4h:$TAG" "${manifests[@]}" \
            --artifact-type application/vnd.osd.system.v1 \
            --annotation "org.opencontainers.image.revision=$commit" \
            --annotation "org.opencontainers.image.version=$TAG" \
            --annotation "org.osd.upstream.abaplint=577f875e"; then
            echo "::warning::system index not created"
            exit 0
          fi
          printf '\nsystem index `abaplint-a4h:%s` = `%s`\n' "$TAG" "$(oras resolve "$REPO/abaplint-a4h:$TAG")" >> "$GITHUB_STEP_SUMMARY"
