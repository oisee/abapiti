name: CI

# The point of this workflow is a cheap verdict on a patch: does it build, vet
# clean, pass the tests, leave the tree clean, and add no new lint findings or
# leaks. Debt that predates a check (old lint findings, big functions) is
# measured and reported, never blocking. Ported from vibing-steampunk (vsp), so
# the two repositories judge a pull request the same way.
# Nothing here talks to a SAP system or to OSD: the OSD run is its own
# workflow (osd-m1.yml), and ci-report.yml shows it next to these checks.
#
# One job per check, so each check is one row in the PR comment that
# ci-report.yml writes. This workflow stays read-only: a pull request from a
# fork only ever gets a read-only token, so the comment is posted from the
# default branch by ci-report.yml, never from here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # One pin for both lint jobs, the same as vsp's. A major version must move
  # because someone moved it: `latest` is what once broke lint in vsp (v2
  # shipped, refused the v1 config, and the job "passed" in 67ms without
  # reading a line of Go). .github/ci/lint.sh refuses to run any other version,
  # and the binary is checked against this hash (from the release's
  # checksums.txt) before use.
  GOLANGCI_LINT_VERSION: v2.13.2
  GOLANGCI_LINT_SHA256: 2277d43b98ec0054280f2ac26b53268bae97682444678a59a657dd565da021d6

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # Cross-compilation only guards main; pull requests do not need to pay
      # for it. `go install github.com/oisee/abapiti/cmd/abapiti@latest` is how
      # the CLI is installed (README), so it must keep compiling on the
      # platforms people run it on.
      - name: Cross-compile check
        if: github.event_name == 'push'
        run: |
          for target in linux/amd64 windows/amd64 darwin/arm64; do
            echo "$target"
            GOOS=${target%/*} GOARCH=${target#*/} go build ./... || exit 1
          done

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

  test-shard:
    name: test shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      TEST_SHARD: ${{ matrix.shard }}
      # -shuffle runs each package's tests in a random order, so a test that
      # only passes after another one has set something up shows up here. The
      # seed is the run id rather than `on`, so it is known before the run, is
      # the same on a re-run, and goes into the log and the report row.
      SHUFFLE_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Outputs go outside the work tree, so the clean-tree check below sees
      # only what the tests themselves left behind.
      - name: Output directory
        run: |
          mkdir -p "$RUNNER_TEMP/test"
          echo "OUT=$RUNNER_TEMP/test" >> "$GITHUB_ENV"

      - name: Select tests
        run: |
          # Shards 1-2 split ./wasm, shards 3-4 split ./tsfront in halves;
          # shard 3 also runs every other package.
          if [ "$TEST_SHARD" -lt 3 ]; then
            go test -list . ./wasm > "$OUT/wasm-list.txt"
            python3 .github/ci/test-shards.py split "$OUT/wasm-list.txt" "$OUT" "$TEST_SHARD"
          else
            go test -list . ./tsfront > "$OUT/tsfront-list.txt"
            python3 .github/ci/test-shards.py split "$OUT/tsfront-list.txt" "$OUT" "$((TEST_SHARD - 2))" tsfront
          fi
          if [ "$TEST_SHARD" -eq 3 ]; then
            go list ./... | grep -vx -e 'github.com/oisee/abapiti/wasm' -e 'github.com/oisee/abapiti/tsfront' > "$OUT/packages.txt"
          fi

      # -race: the wasm tests run their inputs in wazero as the reference, and
      # wazero compiles and runs on goroutines of its own. -json for the counts;
      # it implies -v, so the log is printed back the way plain `go test`
      # would: package lines, build errors, plus the output of the tests that
      # failed. The TypeScript test skips without `npm install`, and clang is
      # optional, as before.
      - name: Test
        id: test
        run: |
          echo "shuffle seed $SHUFFLE_SEED"
          status=0
          run() {
            local tag=$1; shift
            go test -race -shuffle="$SHUFFLE_SEED" -timeout 25m -json -coverprofile="$OUT/cover-$tag.out" "$@" > "$OUT/test-$tag.json" || status=$?
            printf 'reproduce with: go test -race -shuffle=%s -timeout 25m ' "$SHUFFLE_SEED"
            printf '%q ' "$@"
            echo
          }
          if [ "$TEST_SHARD" -lt 3 ]; then
            run wasm -run "$(cat "$OUT/wasm-run.txt")" ./wasm
          else
            run tsfront -run "$(cat "$OUT/tsfront-run.txt")" ./tsfront
          fi
          if [ "$TEST_SHARD" -eq 3 ]; then
            mapfile -t packages < "$OUT/packages.txt"
            [ "${#packages[@]}" -gt 0 ]
            run packages "${packages[@]}"
          fi
          cat "$OUT"/test-*.json > "$OUT/test.json"
          covers=("$OUT"/cover-*.out)
          python3 .github/ci/test-shards.py merge "$OUT/cover.out" "${covers[@]}"
          rm -f "$OUT"/test-*.json "${covers[@]}"
          jq -rsj '(map(select(.Action == "fail" and .Test != null) | .Package + " " + .Test)) as $failed
            | .[] | select(.Action == "output" or .Action == "build-output")
            | select(.Test == null or ((.Package + " " + .Test) as $k | $failed | index($k)))
            | select(.Output | startswith("-test.shuffle ") | not)
            | .Output' "$OUT/test.json"
          exit $status

      # Tests write generated ABAP to t.TempDir(); the tree must stay clean. A
      # test that writes into the checkout would dirty every contributor's
      # tree, and a golden file it rewrites would hide a regression. Runs after
      # a failed test too: a dirty tree is worth knowing about either way.
      - name: Tree is clean after the tests
        if: always() && steps.test.outcome != 'skipped'
        run: |
          dirty=$(git status --porcelain --untracked-files=all)
          if [ -n "$dirty" ]; then
            echo "$dirty"
            echo "::error title=test::The tests left files behind in the work tree (above). Write to t.TempDir() instead."
            echo "dirty" > "$OUT/tree-dirty"
            exit 1
          fi
          echo "work tree clean"

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/test/
          if-no-files-found: warn
          retention-days: 30

  # Grace's inlining is the default, so its equality with hir.Inline on the
  # emit tests' programs is a required check.
  gracecheck:
    name: Grace checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ABAPITI_GRACECHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Grace regression checks
        run: |
          go test -timeout 30m ./tsfront -run '^(TestEmitRegistry|TestLexerFactsReport$)'
          go test -timeout 30m ./hir/rewrite/... ./internal/gracecheck/... ./internal/hirclone/...

  gracefull:
    name: Grace full closure (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    env:
      ABAPITI_GRACE_FULL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Grace on the full 1538-file closure
        run: go test -timeout 55m ./tsfront -run '^TestGraceFullRegistryClosure$' -v

  # Keep this exact check name for branch protection and the merge helper.
  test:
    name: test
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    env:
      SHUFFLE_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Output directory
        run: |
          mkdir -p "$RUNNER_TEMP/test"
          echo "OUT=$RUNNER_TEMP/test" >> "$GITHUB_ENV"

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: test-shard-*
          path: ${{ runner.temp }}/test-shards

      - name: Test aggregation helper
        run: python3 .github/ci/test-shards-test.py

      - name: Merge results and coverage
        if: always()
        run: python3 .github/ci/test-shards.py aggregate "$RUNNER_TEMP/test-shards" "$OUT"

      - name: Every wasm test ran exactly once
        if: always()
        run: python3 .github/ci/test-shards.py check "$RUNNER_TEMP/test-shards"

      # One annotation the report reads back as the row's detail. Coverage is
      # over the compiler and interpreter packages only (wasm, llvm, ts, ts2go,
      # jseval, hir): cmd/ is thin glue and fun/ is demos, and counting them would
      # make the total move for reasons that are not the compilers'.
      - name: Summarise
        if: always()
        run: |
          [ -s "$OUT/test.json" ] || exit 0
          counts=$(jq -rs '[.[] | select(.Test != null and (.Action == "pass" or .Action == "fail" or .Action == "skip"))]
            | "\(map(select(.Action == "pass")) | length) passed, \(map(select(.Action == "fail")) | length) failed, \(map(select(.Action == "skip")) | length) skipped"' "$OUT/test.json")
          builds=$(jq -rs '[.[] | select(.Action == "build-fail")] | length' "$OUT/test.json")
          [ "$builds" -gt 0 ] && counts="$counts, $builds packages did not build"
          cov=""
          if [ -s "$OUT/cover.out" ]; then
            { head -1 "$OUT/cover.out"; grep -E '^github\.com/oisee/abapiti/(wasm|llvm|ts|ts2go|jseval|hir)/' "$OUT/cover.out" || true; } > "$OUT/cover-lib.out"
            cov=$(go tool cover -func="$OUT/cover-lib.out" | awk '/^total:/ {print $3}')
          fi
          tree=""
          [ -e "$OUT/tree-dirty" ] && tree=" · TREE DIRTY after the tests"
          echo "::notice title=ci-report::${counts}${cov:+, compiler coverage $cov}${tree} · seed $SHUFFLE_SEED"

      # The aggregate script writes the existing per-package schema. wasm's
      # seconds sum both halves; its coverage comes from the merged blocks.
      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: ${{ runner.temp }}/test/test-summary.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload combined results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/test/test.json
            ${{ runner.temp }}/test/cover.out
            ${{ runner.temp }}/test/cover-lib.out
          if-no-files-found: ignore
          retention-days: 30

      - name: All shards passed
        if: always()
        env:
          RESULT: ${{ needs.test-shard.result }}
        run: |
          echo "test shards: $RESULT"
          [ "$RESULT" = success ]

  # No fuzz job: ABAPiti has no Fuzz targets yet. vsp's job (a few seconds per
  # target, crashers uploaded, advisory) is the model when one is added.

  # Policy: in CI only correctness and safety gates are red. Quality and style
  # (complexity, size, formatting) are advisory.
  #
  # Blocking: red on any finding in code the change adds or touches, from five
  # correctness linters (errcheck, govet, ineffassign, staticcheck SA, unused;
  # config in .golangci.yml). The 16 findings in 9 files that are older than
  # the gate do not block anyone. Fails closed: a linter crash, config error,
  # load failure or timeout is red, and a canary package with one known finding
  # per linter must come back in the report, so "0 issues" can only mean the
  # linter ran and found nothing. Locally: ./.github/ci/lint.sh gate
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base with the base branch, to tell new code from old.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: |
          ./.github/ci/install-golangci-lint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # On a push to main the merge base is the commit itself, so only the
      # canary is new: the run still proves the gate works on the main branch.
      - name: Lint new code
        env:
          BASE_REF: origin/${{ github.base_ref || github.ref_name }}
        run: ./.github/ci/lint.sh gate "$BASE_REF"

  # Safety gate, blocking: live SAP identifiers (hosts, addresses, SIDs, users)
  # and secrets (session cookies, basic auth, CSRF tokens, config passwords) in
  # what this change publishes. ABAPiti never talks to SAP, but its output is
  # verified on real systems by hand, and the notes and logs of those runs are
  # where a captured value would land. .github/ci/leakscan (the same scanner as
  # vsp's) decodes every byte view of a file (text, UTF-16LE, hex, base64)
  # before matching. What it reads:
  #   pull request: the files it changes (as they are at its head), the lines
  #     every one of its commits added (so a value added and deleted again is
  #     still caught: it is in the history), and every commit message;
  #   push to main: every file in the tree, plus the lines and messages of the
  #     pushed range (event.before..event.after; a new branch: every commit not
  #     on main; a force push, whose before is gone: red. If one got through, a
  #     maintainer scans by hand, -range).
  # The allow-file is read from the base revision on a pull request, so a PR
  # cannot excuse its own hits; a PR that changes it gets a warning to review it.
  # Known limitation: a PR from a branch of this repository runs its own copy
  # of this job and of the scanner, so it could weaken the gate; without branch
  # protection only review stops that, and the job warns when a PR touches it.
  #
  # The identifier list is the ABAPITI_LEAK_IDENTIFIERS secret (one value per
  # line, optionally `class: value`), masked line by line before anything runs.
  # It is expected on a push to this repository and on a pull request from a
  # branch of it, and its absence there is red (fail closed). A pull request
  # from a fork gets no secrets: it runs the generic patterns only, and the job
  # says so in a warning and in the report row, never as a plain pass.
  # Locally:
  #   cd .github/ci/leakscan && go build -o /tmp/leakscan . && /tmp/leakscan -root ../../.. -diff origin/main
  leak-scan:
    name: leak scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base, to tell what the pull request adds.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: .github/ci/leakscan/go.mod
          cache: false

      - name: Test the scanner
        working-directory: .github/ci/leakscan
        run: go test ./...

      # Built, not `go run`: go run turns every non-zero exit into 1, and the
      # step below tells "hits" (1) from "fail closed" (2) from "partial" (3).
      - name: Build the scanner
        working-directory: .github/ci/leakscan
        run: go build -o "$RUNNER_TEMP/leakscan" .

      - name: Scan
        env:
          ABAPITI_LEAK_IDENTIFIERS: ${{ secrets.ABAPITI_LEAK_IDENTIFIERS }}
          EXPECTED: ${{ github.repository == 'oisee/abapiti' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
          EVENT: ${{ github.event_name }}
          BASE_REF: origin/${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Mask every line, and the value after a `class:` prefix, before the
          # scanner (or anything else) can print one.
          while IFS= read -r line || [ -n "$line" ]; do
            line=${line%$'\r'}
            case $line in ''|'#'*) continue ;; esac
            echo "::add-mask::$line"
            value=$(printf '%s' "${line#*:}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            [ -n "$value" ] && echo "::add-mask::$value"
          done <<< "$ABAPITI_LEAK_IDENTIFIERS"

          require=()
          [ "$EXPECTED" = true ] && require=(-require-identifiers)
          allow_note=
          if [ "$EVENT" = pull_request ]; then
            mode=(-diff "$BASE_REF" -allow-rev "$BASE_REF")
            what="pull request's files, added lines and commit messages"
            if ! git diff --quiet "$(git merge-base "$BASE_REF" HEAD)" HEAD -- .github/ci/leakscan-allow.txt; then
              echo "::warning title=leak scan::This pull request changes .github/ci/leakscan-allow.txt. The scan used the base's allow-file; the new rules take effect only after merge, so review each one and its reason."
              allow_note="; allow-file changed, needs review"
            fi
            # Known limitation: the job runs the PR's own copy of this workflow
            # and of the scanner, so a PR from a branch of this repository can
            # weaken the gate it is judged by. Branch protection would close
            # that; until it is on, a reviewer is told.
            gate_files=$(git diff --name-only "$(git merge-base "$BASE_REF" HEAD)" HEAD -- .github/workflows/ci.yml .github/ci/leakscan/ | tr '\n' ' ')
            if [ -n "$gate_files" ]; then
              echo "::warning title=leak scan::This pull request changes the leak scan itself (${gate_files% }), and this run used the changed version. Review that the gate is not weakened before merging."
              allow_note="${allow_note}; changes the gate itself, review it"
            fi
          else
            # A new branch (all-zero BEFORE) is read as every commit not on
            # main; a force push, whose BEFORE is gone, fails closed in the
            # scanner, because the replaced commits cannot be told from the new
            # ones (recovery is manual).
            mode=(-all -push "$BEFORE..$AFTER" -push-base origin/main)
            what="tree and the pushed commits"
          fi
          status=0
          "$RUNNER_TEMP/leakscan" -root "$GITHUB_WORKSPACE" "${require[@]}" "${mode[@]}" || status=$?
          case $status in
            0) echo "::notice title=ci-report::full scan of the ${what}: clean${allow_note}" ;;
            3) echo "::warning title=leak scan::Identifier list unavailable (fork pull request, no secrets): only the generic patterns ran. Host, user and SID names were NOT checked; a maintainer's run on main checks them."
               echo "::notice title=ci-report::PARTIAL: generic patterns only, identifier list unavailable (fork)${allow_note}"
               { echo "### Leak scan: partial"; echo; echo "The identifier list (secret \`ABAPITI_LEAK_IDENTIFIERS\`) is not available to a pull request from a fork, so only the generic patterns ran over the ${what}. Host, user and SID names were not checked."; } >> "$GITHUB_STEP_SUMMARY"
               ;;
            1) echo "::error title=leak scan::Possible leak in the ${what}: see the file:line list above. Replace the value with a placeholder; a value in a commit that a later commit removed is still in the history, so rewrite the branch. A generic false positive can be excused in .github/ci/leakscan-allow.txt, with a reason, in a pull request of its own."
               echo "::notice title=ci-report::hits in the ${what}${allow_note}"
               exit 1 ;;
            *) echo "::error title=leak scan::The scan could not run in full (exit $status), so it cannot pass. If the identifier list is missing, a repository admin must set the ABAPITI_LEAK_IDENTIFIERS secret."
               echo "::notice title=ci-report::fail closed (exit $status)"
               exit "$status" ;;
          esac

  # Advisory: every linter in .github/ci/golangci-full.yml over the whole tree,
  # so the debt stays visible as one number per linter (gofmt and goimports
  # included). New code over a complexity threshold becomes a warning
  # annotation, never an error. A crash or config error still fails the job
  # (it is advisory, so that is grey, not red).
  lint-full:
    name: lint (advisory, full)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base, for the new-code complexity warnings.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: |
          ./.github/ci/install-golangci-lint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint everything
        env:
          BASE_REF: origin/${{ github.base_ref || github.ref_name }}
        run: ./.github/ci/lint.sh full "$BASE_REF"

  # Advisory, observation only: size and complexity per package, file and
  # function (.github/ci/metrics). ci-report.yml compares the artifact with the
  # last green run on main and draws the trend from earlier main runs, which is
  # why it runs on pushes too and is kept for 90 days. Locally:
  #   cd .github/ci/metrics && go run . -root ../../.. -baseline ../complexity-baseline.json -o -
  metrics:
    name: metrics (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: .github/ci/metrics/go.sum

      - name: Test the metrics tool
        working-directory: .github/ci/metrics
        run: go test ./...

      - name: Measure
        working-directory: .github/ci/metrics
        run: |
          status=0
          go run . -root "$GITHUB_WORKSPACE" -baseline ../complexity-baseline.json -o "$RUNNER_TEMP/metrics.json" 2> "$RUNNER_TEMP/metrics-summary.txt" || status=$?
          cat "$RUNNER_TEMP/metrics-summary.txt"
          [ "$status" -eq 0 ] || exit "$status"
          echo "::notice title=ci-report::$(tail -n 1 "$RUNNER_TEMP/metrics-summary.txt")"

      - name: Upload the metrics
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: ${{ runner.temp }}/metrics.json
          retention-days: 90

  fix-proven:
    name: fix proven (advisory)
    # Does a test the pull request adds fail without the pull request's code?
    # The PR's own tests are run against the base's non-test Go files; a test
    # that fails or does not compile there is one that proves the change. The
    # logic is in the script so it can be run locally:
    #   ./.github/ci/fix-proven.sh origin/main
    # Advisory: a refactor or a docs change proves nothing and is still fine.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base with the PR's base branch, and the base's files.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the new tests against the base's code
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: ./.github/ci/fix-proven.sh "$BASE_REF" || true

  go-target:
    name: go target
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOFLAGS: -buildvcs=false
      TSFRONT_ABAPLINT: ${{ github.workspace }}/.tmp/abaplint/packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build pinned Node lexer oracle
        run: |
          mkdir -p .tmp
          git clone --filter=blob:none https://github.com/abaplint/abaplint.git .tmp/abaplint
          git -C .tmp/abaplint fetch origin 577f875ebec44cfaf64841cfe71c8ab8dc32622e
          git -C .tmp/abaplint checkout 577f875ebec44cfaf64841cfe71c8ab8dc32622e
          cd .tmp/abaplint
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix packages/core
          node node_modules/typescript/bin/tsc --project packages/core/tsconfig.json --incremental false
      - name: Download v0.1.1 check kit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.1 --repo oisee/abapiti --pattern zabapgit-check-kit.zip --dir .tmp
