name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # Tests write generated ABAP to t.TempDir(); the tree must stay clean.
        # The TypeScript test skips without "npm install"; clang is optional.
        run: |
          go test ./...
          git status --porcelain
          test -z "$(git status --porcelain)"
