name: OSD M1

# Generated ABAP verified on open-steamgate, in two runtimes. Every OSD module
# from wasm/osd_unit_test.go is compiled with a generated ABAP Unit test class
# (expected values from wazero) and run:
#   osgo: open-steamgate's Go runtime, straight from the files (osgo:unit),
#         open-steamgate checked out at .github/ci/osgo.ref; the primary target;
#   osd-m1: the pinned OSD binary (JS runtime), deployed through ADT with vsp.
# OSD activates through the abaplint transpiler, so green here is not proof of
# kernel behaviour (TYPE i overflow, for one).

# CI calls this workflow for the `osgo` job: compile all emitted fixtures, then
# hir-unit.sh (HIR on osgo, Node oracle, hir-lint, lexer-unit; OSG-JS only in the
# nightly schedule and on workflow_dispatch). The WASM parts
# (osgo-unit.sh and the osd-m1 shards) belong to the legacy WASM path,
# deprecated 2026-10-10, and run only on workflow_dispatch.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  osgo:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GOFLAGS: -buildvcs=false
    steps:
      # npm lifecycle scripts of open-steamgate's dependencies run in this
      # job: do not leave the checkout token in .git/config for them.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pin
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < .github/ci/osgo.ref)" >> "$GITHUB_OUTPUT"

      - name: Cache Go 1.26 builds and npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.npm
          key: osgo-${{ runner.os }}-${{ steps.pin.outputs.ref }}

      - name: Set up the pinned open-steamgate checkout
        run: |
          set -euo pipefail
          .github/ci/osgo-unit.sh "$RUNNER_TEMP/osgo" setup
          mkdir -p .osg-pin-inputs
          cp "$RUNNER_TEMP/osgo/open-steamgate/libs.lock.json" .osg-pin-inputs/
          cp "$RUNNER_TEMP/osgo/open-steamgate/tools/osd-ci-transpiler-build.sh" .osg-pin-inputs/osd-ci-transpiler-build.sh

      - name: Where the pinned transpiler lives
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/osgo/open-steamgate"
          node tools/osd-lock.mjs github-env >> "$GITHUB_ENV"
          echo "TRANSPILER=$RUNNER_TEMP/transpiler" >> "$GITHUB_ENV"

      - name: Restore the pinned transpiler build
        id: transpiler_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/transpiler
          key: transpiler-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.osg-pin-inputs/libs.lock.json') }}-${{ hashFiles('.osg-pin-inputs/osd-ci-transpiler-build.sh') }}

      - name: Build the transpiler this tree is pinned to
        if: steps.transpiler_cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP/osgo/open-steamgate"
          bash tools/osd-ci-transpiler-build.sh build

      - name: Verify and link the pinned transpiler
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/osgo/open-steamgate"
          bash tools/osd-ci-transpiler-build.sh verify
          node tools/osd-link.mjs transpiler packages/transpiler
          node tools/osd-link.mjs transpiler-cli packages/cli
          node tools/osd-link.mjs runtime packages/runtime
          node tools/osd-link.mjs core packages/transpiler/node_modules/@abaplint/core
          node tools/osd-transpiler.mjs

      - name: Run the generated classes on osgo (legacy WASM, dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: .github/ci/osgo-unit.sh "$RUNNER_TEMP/osgo"

      - name: Compile every emitted ABAP fixture on the pinned OSG
        run: nice -n 10 .github/ci/abap-fixture-compile.sh "$RUNNER_TEMP/osgo/open-steamgate" "$RUNNER_TEMP/osgo/fixture-compile"

      - name: Run the HIR corpus on osgo (and OSG-JS nightly)
        env:
          HIR_RUNTIMES: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'osgo osgjs' || 'osgo' }}
        run: .github/ci/hir-unit.sh "$RUNNER_TEMP/osgo"

      - name: Collect artifacts
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/osgo-artifacts"
          mkdir -p "$out"
          for f in "$RUNNER_TEMP"/osgo/{osgo.json,osgo.err,generate.log,setup.log} "$RUNNER_TEMP"/osgo/hir-*.json "$RUNNER_TEMP"/osgo/hir-*.err; do
            if [ -f "$f" ]; then cp "$f" "$out/"; fi
          done
          if [ -d "$RUNNER_TEMP/osgo/fixture-compile/compile" ]; then
            cp "$RUNNER_TEMP/osgo/fixture-compile/compile/fixtures.json" "$out/fixture-manifest.json" || true
            cp "$RUNNER_TEMP/osgo/fixture-compile/compile/build.log" "$out/fixture-build.log" || true
          fi
          if [ -d "$RUNNER_TEMP/osgo/gen" ]; then cp -r "$RUNNER_TEMP/osgo/gen" "$out/gen"; fi
          if [ -d "$RUNNER_TEMP/osgo/hir" ]; then cp -r "$RUNNER_TEMP/osgo/hir" "$out/hir"; fi
          if [ -d "$RUNNER_TEMP/osgo/hir-osgo" ]; then cp -r "$RUNNER_TEMP/osgo/hir-osgo" "$out/hir-osgo"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osgo
          path: ${{ runner.temp }}/osgo-artifacts
          if-no-files-found: warn

  osd-m1-shard:
    name: osd-m1 shard ${{ matrix.shard }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      GH_TOKEN: ${{ github.token }}
      OSD_WARM: "0"
      STG_PORT: "3030"
      OSD_SHARD: ${{ matrix.shard }}
      OSD_SHARDS: "3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Work directories
        run: |
          echo "WORK=$RUNNER_TEMP/osd-m1" >> "$GITHUB_ENV"
          echo "OSD_DIR=$RUNNER_TEMP/osd" >> "$GITHUB_ENV"

      - name: Start OSD (pinned)
        run: .github/ci/osd-up.sh "$OSD_DIR"

      - name: Deploy and test this shard
        run: .github/ci/osd-m1.sh "$WORK"

      - name: Stop OSD
        if: always()
        run: |
          if [ -n "${OSD_PID:-}" ]; then kill "$OSD_PID" 2>/dev/null || true; fi

      - name: Collect artifacts
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/artifacts"
          mkdir -p "$out/gen" "$out/log"
          if [ -d "$WORK/gen" ]; then cp -r "$WORK/gen/." "$out/gen/"; fi
          for f in "$WORK"/log/*.log "$OSD_DIR/osd.log" "$OSD_DIR/build.json"; do
            [ -f "$f" ] || continue
            .github/ci/osd-redact.sh < "$f" > "$out/log/$(basename "$f")"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osd-m1-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: warn

  osd-m1:
    needs: osd-m1-shard
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        env:
          RESULT: ${{ needs.osd-m1-shard.result }}
        run: |
          echo "osd-m1 shards: $RESULT"
          [ "$RESULT" = success ]
