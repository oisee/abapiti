name: OSD M1

# Generated ABAP verified on open-steamgate, in two runtimes. Every OSD module
# from wasm/osd_unit_test.go is compiled with a generated ABAP Unit test class
# (expected values from wazero) and run:
#   osgo: open-steamgate's Go runtime, straight from the files (osgo:unit),
#         open-steamgate checked out at .github/ci/osgo.ref; the primary target;
#   osd-m1: the pinned OSD binary (JS runtime), deployed through ADT with vsp.
# OSD activates through the abaplint transpiler, so green here is not proof of
# kernel behaviour (TYPE i overflow, for one).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osgo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # npm lifecycle scripts of open-steamgate's dependencies run in this
      # job: do not leave the checkout token in .git/config for them.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pin
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < .github/ci/osgo.ref)" >> "$GITHUB_OUTPUT"

      - name: Cache Go 1.26 builds and npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.npm
          key: osgo-${{ runner.os }}-${{ steps.pin.outputs.ref }}

      - name: Run the generated classes on osgo
        run: .github/ci/osgo-unit.sh "$RUNNER_TEMP/osgo"

      - name: Collect artifacts
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/osgo-artifacts"
          mkdir -p "$out"
          for f in osgo.json osgo.err generate.log setup.log; do
            [ -f "$RUNNER_TEMP/osgo/$f" ] && cp "$RUNNER_TEMP/osgo/$f" "$out/"
          done
          if [ -d "$RUNNER_TEMP/osgo/gen" ]; then cp -r "$RUNNER_TEMP/osgo/gen" "$out/gen"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osgo
          path: ${{ runner.temp }}/osgo-artifacts
          if-no-files-found: warn

  osd-m1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OSD_WARM: "0"
      STG_PORT: "3030"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Work directories
        run: |
          echo "WORK=$RUNNER_TEMP/osd-m1" >> "$GITHUB_ENV"
          echo "OSD_DIR=$RUNNER_TEMP/osd" >> "$GITHUB_ENV"

      - name: Start OSD (pinned)
        run: .github/ci/osd-up.sh "$OSD_DIR"

      - name: Deploy and test add, factorial
        run: .github/ci/osd-m1.sh "$WORK"

      - name: Stop OSD
        if: always()
        run: |
          if [ -n "${OSD_PID:-}" ]; then kill "$OSD_PID" 2>/dev/null || true; fi

      - name: Collect artifacts
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/artifacts"
          mkdir -p "$out/gen" "$out/log"
          if [ -d "$WORK/gen" ]; then cp -r "$WORK/gen/." "$out/gen/"; fi
          for f in "$WORK"/log/*.log "$OSD_DIR/osd.log" "$OSD_DIR/build.json"; do
            [ -f "$f" ] || continue
            .github/ci/osd-redact.sh < "$f" > "$out/log/$(basename "$f")"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osd-m1
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: warn
